$kind: http-request
name: Update product
method: PUT
url: 'http://127.0.0.1:8000/api/products/{{productId}}/'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Wireless Mouse Pro",
      "description": "Updated ergonomic wireless mouse",
      "price": "34.99",
      "stock": 40
    }
